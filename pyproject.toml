[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmind"
version = "2.0.2"
description = "Hardware benchmarking and diagnostics suite with honest error bars."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "psutil>=5.9",
    "threadpoolctl>=3.1",
    "requests>=2.28",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gpu = ["pyopencl>=2023.1"]
cloud = ["supabase>=2.0"]
dev = ["httpx>=0.24"]

[project.scripts]
benchmind = "run:main"

[tool.setuptools]
packages = ["api", "ai", "benchmarks", "benchmarks.cpu", "benchmarks.gpu",
            "monitoring", "storage", "db", "scripts"]

[tool.setuptools.package-data]
"*" = ["web/*.html"]
